# macOS app: build LittleBigMouse.app for Apple Silicon and Intel and package each as
# a .dmg (packaging/macos/build-app.sh).
#
# - Run by hand (Actions → macOS app → Run workflow): the .dmg files are uploaded as
#   build artifacts, to try before releasing.
# - Push a tag mac-vX.Y.Z (e.g. `git tag mac-v1.0.0 && git push origin mac-v1.0.0`):
#   additionally creates a DRAFT GitHub release with both .dmg files attached, to
#   review and publish from the Releases page.
#
# Signing is ad-hoc unless the repository has these secrets (Apple Developer ID):
#   MACOS_CERTIFICATE_P12      base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD its password
#   MACOS_SIGN_IDENTITY        "Developer ID Application: Name (TEAMID)"
#   MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, MACOS_NOTARY_PASSWORD
#                              (app-specific password) to notarize as well

name: macOS app

on:
  push:
    tags: [ "mac-v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Rust toolchain (pinned by rust-toolchain.toml) and both Mac targets
        working-directory: rust
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Developer ID certificate (optional)
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_APPLE_ID" ]; then
            xcrun notarytool store-credentials lbm-notary --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
            echo "NOTARY_PROFILE=lbm-notary" >> "$GITHUB_ENV"
          fi

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mac-v* ]]; then
            echo "version=${GITHUB_REF_NAME#mac-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep -E '^\s*<Version>[0-9]' Directory.Build.props | head -1 | sed -E 's/.*<Version>([^<]+)<.*/\1/')-dev.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app (Apple Silicon and Intel)
        run: packaging/macos/build-app.sh --arch both --version "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: LittleBigMouse-${{ steps.version.outputs.version }}-mac
          path: dist/*.dmg

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Little Big Mouse for macOS.

          **Download:** `…-mac-arm64.dmg` for Apple Silicon (M1 and later), `…-mac-x64.dmg` for Intel Macs.

          **Install:** open the .dmg and drag **LittleBigMouse** to **Applications**.

          **First launch:** if macOS says the app can't be checked for malicious software, open
          **System Settings → Privacy & Security**, scroll down and click **Open Anyway** (once).

          **Accessibility:** when you press Start, allow **LittleBigMouse** under
          System Settings → Privacy & Security → Accessibility.

          Setup guide and known gaps: see the README.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.dmg --draft \
            --title "Little Big Mouse for macOS ${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
